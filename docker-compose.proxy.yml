# Use together with docker-compose.production.yml when Nginx Proxy Manager
# owns host ports 80 and 443. This file clears those bindings and joins the
# external Docker network `webproxy`. Create that network once:
#   docker network create webproxy

services:
  nginx:
    container_name: sports35_nginx
    ports: !override []
    volumes: !override
      - sports35_code:/var/www/html:ro
      - sports35_storage:/var/www/html/storage:ro
      - ./docker/nginx/behind-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks: !override
      - sports35
      - webproxy

networks:
  webproxy:
    name: webproxy
    external: true
