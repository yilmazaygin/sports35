services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
    image: sports35-app:production
    restart: unless-stopped
    env_file:
      - ${SPORTS35_ENV_FILE:-.env.production}
    working_dir: /var/www/html
    volumes:
      - sports35_code:/var/www/html
      - sports35_storage:/var/www/html/storage
    networks:
      - sports35
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - sports35_code:/var/www/html:ro
      - sports35_storage:/var/www/html/storage:ro
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    networks:
      - sports35
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${SPORTS35_ENV_FILE:-.env.production}
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sports35
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - sports35
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    image: sports35-app:production
    restart: unless-stopped
    env_file:
      - ${SPORTS35_ENV_FILE:-.env.production}
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - sports35_code:/var/www/html
      - sports35_storage:/var/www/html/storage
    networks:
      - sports35
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  sports35:
    driver: bridge

volumes:
  sports35_code:
  sports35_storage:
  postgres_data:
  redis_data:
