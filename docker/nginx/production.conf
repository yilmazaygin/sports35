# Production nginx template — SSL via Let's Encrypt (certbot)
# Copy to your server and adjust domain names / certificate paths.

resolver 127.0.0.11 valid=30s ipv6=off;

# Redirect HTTP → HTTPS (public)
server {
    listen 80;
    server_name domainim.com www.domainim.com;
    return 301 https://domainim.com$request_uri;
}

# Redirect HTTP → HTTPS (admin)
server {
    listen 80;
    server_name admin.domainim.com;
    return 301 https://admin.domainim.com$request_uri;
}

# Public site — https://domainim.com
server {
    listen 443 ssl http2;
    server_name domainim.com www.domainim.com;

    ssl_certificate     /etc/letsencrypt/live/domainim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domainim.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 40M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Admin panel — https://admin.domainim.com
server {
    listen 443 ssl http2;
    server_name admin.domainim.com;

    ssl_certificate     /etc/letsencrypt/live/admin.domainim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.domainim.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 40M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $host;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
