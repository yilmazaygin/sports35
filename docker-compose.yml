services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sports35_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - sports35
    environment:
      INERTIA_SSR_ENABLED: "true"
      INERTIA_SSR_URL: http://ssr:13714
      INERTIA_SSR_ENSURE_BUNDLE_EXISTS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ssr:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: sports35_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sports35
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: sports35_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sports35}
      POSTGRES_USER: ${DB_USERNAME:-sports35}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sports35
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sports35} -d ${DB_DATABASE:-sports35}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sports35_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - sports35

  ssr:
    image: node:22-alpine
    container_name: sports35_ssr
    restart: unless-stopped
    working_dir: /var/www/html
    command: node --require ./bootstrap/ssr-listen.cjs bootstrap/ssr/ssr.js
    volumes:
      - ./:/var/www/html
    networks:
      - sports35

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sports35_worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./:/var/www/html
    networks:
      - sports35
    depends_on:
      - app
      - redis
      - postgres

networks:
  sports35:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
